# Workflow: Builds, packages, and deploys app to AWS ECS
name: Deploy Application

# Trigger: Runs on pushes to main, or manually from GitHub Actions
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  oidc-test:
    name: Test AWS OIDC connection
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main'))
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: GitHubActions-OIDC-Test-${{ github.run_id }}

      - name: Verify AWS caller identity
        run: aws sts get-caller-identity